name: Auto-Sync Real Leaderboard

on:
  schedule:
    # Runs automatically every 2 hours (change to '0 * * * *' for every 1 hour)
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build leaderboard.json from Firebase
        run: node scripts/sync-leaderboard.mjs

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/leaderboard.json
          if git diff --cached --quiet; then
            echo "No leaderboard changes to commit."
          else
            git commit -m "Auto-update real leaderboard"
            git push
          fi
